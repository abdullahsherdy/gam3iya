# Gam3iya technical plan (machine-readable twin of technical-plan.md)
plan:
  name: Gam3iya 16-week mentorship build
  date: 2026-10-21
  status: proposed
  sources: [docs/PRD.md, docs/SRS.md, docs/technical-specification.md, docs/adr/README.md]
commitment:
  scope: PRD P0 in full; selected P1 in milestone 4; P2 excluded
  team: {student_developers: 1, mentor_reviewers: 1}
  duration_weeks: 16
  capacity_hours_per_week: 8
  capacity_hours_total: 128
  planned_hours: 112
  buffer_hours: 16
  live_sessions_per_week: 2
  live_session_minutes: 90
checkpoint:
  week: 2
  metric: actual_hours / estimated_hours, per work type, from the calibration log
  work_types: [domain, ui, api, database, devops, testing, docs]
  rule: {at_or_below: 1.25, action_if_above: apply cut_order in sequence until remaining estimate fits remaining hours}
  never_cut: [tests, scope_enforcement, audit, money_integrity, pull_request_workflow]
cut_order:
  - {rank: 1, cut: "PDF statement export and payment proof upload (P1)"}
  - {rank: 2, cut: "Email reminders (keep in-app)"}
  - {rank: 3, cut: "MongoDB activity feed falls back to a PostgreSQL JSONB table; document modeling is learned in a spike instead"}
  - {rank: 4, cut: "Playwright reduced to one main flow"}
  - {rank: 5, cut: "BullMQ worker replaced by a scheduled job in the API process"}
milestones:
  - id: M0
    name: "Walking skeleton and setup"
    weeks: "1"
    planned_hours: 7
    exit_gate:
      - "Repository on GitHub with protected main and a PR template"
      - "CI green on a pull request (lint, typecheck, test)"
      - "ADR-001, ADR-003, ADR-009 drafted"
      - "Diagnostic task reviewed; calibration log has its first entries"
    work_packages:
      - {id: "0.1", weeks: "1", hours: 3, type: devops, work: "Monorepo: pnpm workspaces, strict TypeScript, ESLint, Prettier, Vite app, empty domain and contracts packages"}
      - {id: "0.2", weeks: "1", hours: 2, type: devops, work: "Git workflow: branch protection, PR template, issue board, conventional commits, first CI workflow"}
      - {id: "0.3", weeks: "1", hours: 1, type: docs, work: "Read PRD and SRS; draft ADR-001, 003, 009; diagnostic task"}
      - {id: "0.4", weeks: "1", hours: 1, type: docs, work: "Calibration log and AI-assist policy file"}
  - id: M1
    name: "Frontend MVP on a mock API"
    weeks: "2-4"
    planned_hours: 22
    exit_gate:
      - "PRD Appendix A examples A1 to A5 pass as automated tests"
      - "Domain package coverage 90% or higher"
      - "UI complete for stories B1, B4, C1 to C3, D1, D2 against the mock API"
      - "CI green; preview deployed; mentor demo done"
    work_packages:
      - {id: "1.1", weeks: "2", hours: 5, type: domain, work: "Domain package: money, schedule, payment status, payout rule, tests from PRD Appendix A written first"}
      - {id: "1.2", weeks: "2", hours: 2, type: domain, work: "Contracts: Zod schemas, inferred types, typed seed data, parse at boundaries"}
      - {id: "1.3", weeks: "3", hours: 3, type: ui, work: "App shell: routing, layout, design tokens, Arabic and English, right-to-left"}
      - {id: "1.4", weeks: "3", hours: 3, type: ui, work: "Circles list and create-circle form with validation"}
      - {id: "1.5", weeks: "3-4", hours: 3, type: ui, work: "Circle detail: members, cycle table, derived status badges"}
      - {id: "1.6", weeks: "4", hours: 3, type: ui, work: "TanStack Query with MSW mock API; loading, error, empty states; optimistic mark-paid"}
      - {id: "1.7", weeks: "4", hours: 2, type: testing, work: "Component tests and domain coverage gate"}
      - {id: "1.8", weeks: "4", hours: 1, type: devops, work: "Full CI pipeline and preview deployment; M1 demo"}
  - id: M2
    name: "Real API and PostgreSQL"
    weeks: "5-8"
    planned_hours: 28
    exit_gate:
      - "All P0 endpoints implemented; OpenAPI lints clean"
      - "Role by endpoint authorization matrix at 100% of endpoints"
      - "Idempotency, audit-grant, and refresh-reuse tests pass"
      - "API coverage 70% or higher; frontend wired to the real API; deployed on managed PostgreSQL"
    work_packages:
      - {id: "2.1", weeks: "5", hours: 5, type: database, work: "ERD, Prisma schema, migrations, constraints, seed, Docker Compose PostgreSQL"}
      - {id: "2.2", weeks: "5", hours: 2, type: database, work: "Fifteen reporting queries in SQL (late payers, totals per circle, next payout)"}
      - {id: "2.3", weeks: "6", hours: 3, type: api, work: "NestJS skeleton: config, health, validation, RFC 7807 filter, OpenAPI; ORM spike for ADR-002"}
      - {id: "2.4", weeks: "6", hours: 5, type: api, work: "Circles, members, invites, cycles endpoints; activation transaction"}
      - {id: "2.5", weeks: "7", hours: 4, type: api, work: "Authentication: argon2id, JWT, rotating refresh tokens with reuse detection"}
      - {id: "2.6", weeks: "7", hours: 3, type: api, work: "Scoped repositories and role by endpoint authorization test matrix"}
      - {id: "2.7", weeks: "8", hours: 4, type: api, work: "Payment state machine, transaction, idempotency receipts, payouts"}
      - {id: "2.8", weeks: "8", hours: 1, type: database, work: "Append-only audit and database role grants"}
      - {id: "2.9", weeks: "8", hours: 1, type: database, work: "Indexes with EXPLAIN ANALYZE, cursor pagination, deploy to managed PostgreSQL; M2 demo"}
  - id: M3
    name: "Next.js, CI/CD, and production quality"
    weeks: "9-12"
    planned_hours: 28
    exit_gate:
      - "Next.js app in production behind an approved release pipeline"
      - "Lighthouse 90 or higher on public pages; zero critical items on the security checklist"
      - "Playwright main flow green in CI"
      - "Case-study README and all ADRs marked Accepted or Reversed with evidence"
    work_packages:
      - {id: "3.1", weeks: "9", hours: 4, type: ui, work: "Next.js app: landing page and public circle page with metadata and SEO"}
      - {id: "3.2", weeks: "9", hours: 3, type: ui, work: "Port layouts and dashboard; server versus client component boundaries"}
      - {id: "3.3", weeks: "10", hours: 3, type: ui, work: "Cookie session and middleware; protected routes"}
      - {id: "3.4", weeks: "10", hours: 3, type: ui, work: "Server actions for create circle, mark paid, confirm; revalidation"}
      - {id: "3.5", weeks: "10", hours: 2, type: ui, work: "Caching rules, loading and error boundaries"}
      - {id: "3.6", weeks: "11", hours: 4, type: devops, work: "CI/CD: matrix, caching, previews, protected main, approvals, release tags, Dependabot"}
      - {id: "3.7", weeks: "11", hours: 2, type: devops, work: "Docker images, environment and secrets management, backup and restore drill"}
      - {id: "3.8", weeks: "12", hours: 3, type: testing, work: "Security checklist, accessibility audit, Core Web Vitals pass"}
      - {id: "3.9", weeks: "12", hours: 3, type: testing, work: "Playwright end-to-end main flow"}
      - {id: "3.10", weeks: "12", hours: 1, type: docs, work: "Case-study README and ADR completion"}
  - id: M4
    name: "Document store, Redis, scale, interviews"
    weeks: "13-16"
    planned_hours: 27
    exit_gate:
      - "Activity feed and notifications in MongoDB through the outbox; Redis rate limiting; reminder worker running"
      - "k6 report meets NFR-PERF-01"
      - "System design document for 1 million users reviewed by the mentor"
      - "Three mock interviews completed with at least Level 3 in 6 of 8 rubric areas"
    work_packages:
      - {id: "4.1", weeks: "13", hours: 4, type: database, work: "MongoDB activity feed and notifications, outbox publisher, read API"}
      - {id: "4.2", weeks: "13", hours: 2, type: docs, work: "Database landscape decision guide (key-value, graph, time-series, columnar, vector)"}
      - {id: "4.3", weeks: "14", hours: 3, type: api, work: "Redis: rate limiting and idempotency cache"}
      - {id: "4.4", weeks: "14", hours: 4, type: api, work: "BullMQ reminder worker and in-app reminders"}
      - {id: "4.5", weeks: "15", hours: 3, type: testing, work: "k6 load test, p95 baseline, index review"}
      - {id: "4.6", weeks: "15", hours: 3, type: docs, work: "System design document: scaling to 1 million users"}
      - {id: "4.7", weeks: "15", hours: 2, type: docs, work: "Four practice system designs with the mentor as interviewer"}
      - {id: "4.8", weeks: "16", hours: 2, type: ui, work: "Polish: UX, accessibility, Arabic review fixes, README"}
      - {id: "4.9", weeks: "16", hours: 2, type: docs, work: "CV, LinkedIn, and GitHub profile README"}
      - {id: "4.10", weeks: "16", hours: 2, type: docs, work: "Three mock interviews and demo day"}
weekly_buffer_hours:
  {w1: 1, w2: 1, w3: 0, w4: 1, w5: 1, w6: 0, w7: 1, w8: 2, w9: 1, w10: 0, w11: 2, w12: 1, w13: 2, w14: 1, w15: 0, w16: 2}
ai_assist_policy:
  weeks_1_to_4: tutor only; no generated code that the student cannot explain line by line
  weeks_5_to_16: pair allowed for boilerplate and tests; student writes domain, auth, payment, and audit logic
  always: [explain-back before merge, tests first from PRD acceptance checks, mentor reviews auth and payment code]
inputs:
  - {input: "Laptop, GitHub account, hosting accounts", owner: student, due: "week 1"}
  - {input: "Diagnostic task completed", owner: student, due: "week 1"}
  - {input: "Managed PostgreSQL and hosting free-tier accounts", owner: student, due: "week 4"}
  - {input: "Native Arabic reviewer", owner: mentor, due: "week 11"}
  - {input: "Five real organizers to test the app", owner: mentor, due: "week 11"}
  - {input: "Mock interviewers (two engineers)", owner: mentor, due: "week 15"}
